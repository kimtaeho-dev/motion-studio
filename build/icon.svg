<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Motion Studio: a pill-shaped button morphing into a circle, its earlier
       states left behind as a fading trail. macOS icon grid: 824px plate. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1E22"/>
      <stop offset="1" stop-color="#101113"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <!-- the trail: the same shape at earlier sizes -->
  <rect x="214" y="430" width="420" height="164" rx="82" fill="#FFFFFF" fill-opacity="0.10"/>
  <rect x="300" y="430" width="330" height="164" rx="82" fill="#FFFFFF" fill-opacity="0.20"/>
  <rect x="402" y="430" width="232" height="164" rx="82" fill="#FFFFFF" fill-opacity="0.38"/>
  <!-- where it lands -->
  <circle cx="694" cy="512" r="118" fill="#FF7A45"/>
  <path d="M640 514 l36 36 l72 -78" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
